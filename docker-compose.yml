services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: tp6-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}); 1 }' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "1025:1025"

  activation-api:
    build: .
    command: ["npm", "run", "start:activation"]
    environment: &common
      KAFKA_BROKERS: kafka:29092
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
    ports:
      - "3000:3000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  billing-service:
    build: .
    command: ["npm", "run", "start:billing"]
    environment:
      <<: *common
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  provisioning-service:
    build: .
    command: ["npm", "run", "start:provisioning"]
    environment:
      <<: *common
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  notification-service:
    build: .
    command: ["npm", "run", "start:notification"]
    environment:
      <<: *common
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started

  crm-analytics-service:
    build: .
    command: ["npm", "run", "start:crm"]
    environment:
      <<: *common
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  loyalty-service:
    build: .
    command: ["npm", "run", "start:loyalty"]
    profiles: ["loyalty"]
    environment:
      <<: *common
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  demo-ui:
    build: .
    command: ["npm", "run", "start:ui"]
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - activation-api
